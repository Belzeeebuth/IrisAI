# Alternative au service systemd : lancement par Hyprland.
# À inclure dans ~/.config/hypr/autostart.conf (Omarchy) ou hyprland.conf :
#   source = ~/.config/hypr/iris-autostart.conf
# Le service systemd (`iris service install`) reste recommandé : il redémarre Iris en cas de plantage.
exec-once = uwsm app -- ~/.local/bin/iris run
