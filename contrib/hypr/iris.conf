# Raccourcis Hyprland pour Iris — à inclure depuis ~/.config/hypr/bindings.conf :
#   source = ~/.config/hypr/iris.conf
# Adapte les touches si elles sont déjà prises (omarchy-menu-keybindings liste les raccourcis actifs).
bindd = SUPER ALT, SPACE, Iris : push-to-talk, exec, iris trigger
bindd = SUPER ALT, P, Iris : pause / reprise, exec, iris trigger --pause
bindd = SUPER ALT, R, Iris : relancer, exec, iris restart
