# ============================================================================
#  Iris — configuration par défaut
#  Copie personnelle : ~/.config/iris/config.toml   (créée par `iris config init`)
#  Toute clé absente de ta copie prend la valeur ci-dessous.
# ============================================================================

[assistant]
name = "Iris"
language = "fr"            # "fr" | "en" | "auto" (répond dans la langue entendue, transcription auto)
verbosity = "normal"       # "concise" | "normal" | "chatty"
tone = "warm"              # "warm" (chaleureuse) | "direct" | "coach" | "playful" (taquine) | "pro" | "zen"
personality = ""           # profil libre pour le LLM et la voix OpenAI, ex. "Tutoie-moi, sois directe et un peu taquine."
active_window_s = 8.0      # après « Hey Iris » seule, temps d'attente d'une commande (s)
follow_up_window_s = 5.0   # après une commande, fenêtre pour enchaîner sans mot d'activation (s)
confirm_timeout_s = 12.0   # délai de réponse à « Veux-tu vraiment … ? » (s)
ack_sound = true           # petit signal sonore à l'activation (si un lecteur audio est disponible)
resume_prompt = false      # au démarrage, proposer « Veux-tu reprendre ta session d'hier ? » (voir [memory])
quiet_hours = ""           # ex. "22:00-07:00" : réponses concises et aucune suggestion proactive

[wake]
# "transcript"   : le mot d'activation est reconnu dans la transcription (aucun modèle à entraîner)
# "openwakeword" : détection sur l'audio brut avec un modèle openWakeWord personnalisé (plus réactif)
# "none"         : pas de mot d'activation, chaque phrase est une commande (mode « push-to-talk » / test)
backend = "transcript"
phrases = ["hey iris", "iris", "ok iris", "salut iris", "dis iris", "hé iris"]
fuzzy_threshold = 0.76     # tolérance aux variantes de transcription (« Irisse », « Irish »…)
openwakeword_model = ""    # chemin vers hey_iris.onnx / .tflite (voir docs/WAKEWORD.md)
openwakeword_threshold = 0.5

[audio]
backend = "auto"           # "auto" | "sounddevice" | "parec" | "pw-record" | "arecord"
device = ""                # nom/index du périphérique (sounddevice) ou source PipeWire (parec) ; vide = défaut
player = "auto"            # lecture des réponses : "auto" | "pw-play" | "paplay" | "aplay" | "ffplay" | "mpv" | "sounddevice"
sample_rate = 16000
frame_ms = 30
vad_backend = "auto"       # "auto" | "webrtc" | "energy"
vad_aggressiveness = 2     # webrtc : 0 (permissif) → 3 (strict)
energy_threshold = 0.010   # VAD énergie : seuil RMS (0.0 → 1.0)
silence_ms = 800           # silence marquant la fin d'une phrase
min_speech_ms = 250        # durée minimale de parole pour considérer une phrase
max_utterance_s = 15.0     # coupe les phrases trop longues
pre_roll_ms = 300          # audio conservé avant le début détecté de la parole

[stt]
backend = "faster-whisper" # "faster-whisper" | "openai" | "none"
model = "base"             # tiny | base | small | medium | large-v3 | chemin local  (small = bon compromis en français)
device = "auto"            # "auto" (cuda si les bibliothèques NVIDIA sont chargeables, sinon cpu) | "cpu" | "cuda"
compute_type = "int8"      # int8 (CPU) | float16 (GPU) | default
language = ""              # vide = suit assistant.language ; "auto" = détection automatique
beam_size = 1
cloud_fallback = false     # bascule sur l'API Whisper d'OpenAI si le modèle local échoue (nécessite privacy.allow_cloud)
openai_model = "whisper-1"

[tts]
# "auto" choisit la meilleure voix disponible : elevenlabs (si ELEVENLABS_API_KEY et allow_cloud)
# → openai (si OPENAI_API_KEY) → cartesia (si CARTESIA_API_KEY) → kokoro (si installé) → piper → espeak → console.
backend = "auto"
max_spoken_chars = 600     # au-delà, la réponse est tronquée à l'oral (le texte complet reste dans le journal)
cache = true               # mémorise les phrases déjà synthétisées (moins de latence et de crédits cloud)
cache_max_mb = 200

# --- ElevenLabs : la voix IA de référence (https://elevenlabs.io → Profile → API keys → ELEVENLABS_API_KEY)
elevenlabs_voice = "Sarah"             # nom ou identifiant. Voix françaises natives : `iris voices library --lang fr`
elevenlabs_model = "eleven_multilingual_v2"   # ou eleven_flash_v2_5 (latence minimale), eleven_v3 (le plus expressif)
elevenlabs_output_format = "pcm_24000"
elevenlabs_stability = 0.45            # bas = plus expressif, haut = plus régulier (v3 : 0.0 / 0.5 / 1.0)
elevenlabs_similarity = 0.8
elevenlabs_style = 0.15                # exagération du style (pas pour v3)
elevenlabs_speed = 1.0                 # 0.7 → 1.2
elevenlabs_speaker_boost = true
elevenlabs_api_key_env = "ELEVENLABS_API_KEY"
elevenlabs_api_key = ""                # ou directement ici (déconseillé)

# --- OpenAI gpt-4o-mini-tts (voix pilotable par instructions) ou serveur local compatible (Kokoro-FastAPI, Speaches)
openai_base_url = "https://api.openai.com/v1"
openai_model = "gpt-4o-mini-tts"
openai_voice = "coral"     # alloy, ash, ballad, coral, echo, fable, nova, onyx, sage, shimmer, verse, marin, cedar
openai_instructions = ""   # vide = style dérivé du ton ; ex. "Voix chaleureuse et posée, léger sourire."
openai_speed = 1.0
openai_api_key_env = "OPENAI_API_KEY"

# --- Cartesia Sonic (https://play.cartesia.ai → API keys → CARTESIA_API_KEY)
cartesia_voice = ""        # identifiant de voix ; `iris voices list --engine cartesia --lang fr`
cartesia_model = "sonic-3"
cartesia_emotion = ""      # ex. "content", "calm", "enthusiastic", "curious" (sonic-3)
cartesia_speed = 1.0
cartesia_api_key_env = "CARTESIA_API_KEY"

# --- Kokoro : voix neuronale locale (facultative, `iris voices download kokoro`)
kokoro_model = "kokoro-v1.0.onnx"    # ou kokoro-v1.0.int8.onnx (3× plus léger)
kokoro_voice = ""          # vide = ff_siwis (fr) / af_heart (en)
kokoro_speed = 1.0
kokoro_lang = ""           # vide = suit assistant.language ; ex. "fr-fr", "en-us"
kokoro_models_dir = ""     # vide = ~/.local/share/iris/kokoro

# --- Piper : voix locale de secours
piper_voice = "fr_FR-siwis-medium"   # `iris voices list` pour les autres voix
piper_voices_dir = ""      # vide = ~/.local/share/iris/voices
piper_length_scale = 1.0   # < 1 = parle plus vite, > 1 = plus lentement
piper_sentence_silence = 0.15
espeak_voice = "fr"

[privacy]
allow_cloud = false        # interrupteur général : false = aucun octet ne quitte la machine
                           # (à passer à true pour OpenCode Zen/Go, OpenAI ou ElevenLabs ; les URL localhost restent toujours permises)
store_transcripts = false  # conserver le texte des phrases entendues dans le journal
journal_actions = true     # tracer chaque action exécutée (traçabilité)
# L'audio du micro n'est jamais écrit sur le disque : il vit en mémoire le temps de la transcription.

[system]
terminal = ""              # vide = $TERMINAL puis ghostty/alacritty/kitty/foot
browser = ""               # vide = omarchy-launch-browser puis $BROWSER
editor = ""                # vide = omarchy-launch-editor puis $VISUAL/$EDITOR
launcher = "auto"          # "auto" | "uwsm" | "systemd-run" | "direct"
volume_step = 5            # pas (en %) pour « monte / baisse le son »
brightness_step = 10
search_url = "https://duckduckgo.com/?q={q}"
notify = true              # notifications bureau (notify-send) en plus de la voix
typing_tool = "auto"       # dictée : "wtype" | "ydotool" | "clipboard" (wl-copy + notification)
status_file = ""           # état pour Waybar/Quickshell ; vide = $XDG_RUNTIME_DIR/iris/state.json
waybar_signal = 0          # ex. 8 → `pkill -RTMIN+8 waybar` à chaque changement (voir contrib/waybar)

# ----------------------------------------------------------------------------
# Cerveau LLM : phrases inconnues, questions ouvertes, personnalité, contexte.
# Provider par défaut : OpenCode Go (10 $/mois, modèles ouverts) ; OpenCode Zen (paiement à l'usage,
# modèles frontière) ; ou n'importe quel endpoint OpenAI-compatible (Ollama en local, OpenRouter…).
# Clé : https://opencode.ai/auth → variable d'environnement OPENCODE_API_KEY (ou api_key ci-dessous).
# ----------------------------------------------------------------------------
[llm]
enabled = false
provider = "opencode-go"   # "opencode-go" | "opencode-zen" | "openai" | "openrouter" | "ollama" | "custom"
base_url = ""              # custom : ex. "http://localhost:11434/v1"
api = "auto"               # "auto" | "chat" (OpenAI /chat/completions) | "messages" (Anthropic /messages)
model = "glm-5.3-flash"    # Go : glm-5.3-flash, minimax-m3, kimi-k2.6, qwen3.7-plus… ; Zen : claude-haiku-4-5, gpt-5.4-mini…
api_key_env = "OPENCODE_API_KEY"
api_key = ""
timeout_s = 15.0            # un assistant vocal ne peut pas rester muet 30 s : on abandonne plus tôt
max_tokens = 400
temperature = 0.4
fallback_nlu = true        # phrase non reconnue par les règles → le LLM choisit une action Iris ou répond
chat = true                # « Iris, explique-moi … », « pourquoi … », « question : … »
context = true             # transmet heure, fenêtre active, workspace et dernières actions
history_turns = 6          # tours de conversation transmis au modèle (persistants, voir [memory])
system_prompt_extra = ""
stream = true              # réponses parlées phrase par phrase pendant la génération
tools = true               # le modèle peut utiliser : calc, clipboard, read_file (dans ton dossier), recall, tasks

# ----------------------------------------------------------------------------
# Mémoire persistante : faits (« retiens que … »), historique LLM, instantanés de session.
# ----------------------------------------------------------------------------
[memory]
enabled = true
snapshot_interval_min = 10 # instantané des fenêtres ouvertes (workspace par workspace) pour la reprise
resume_min_age_min = 60    # ne proposer la reprise que si l'instantané date d'au moins une heure
max_facts = 200

# ----------------------------------------------------------------------------
# Apprentissage des habitudes (local, depuis le journal) et automatisations programmées.
# « Veux-tu aussi … ? » après une action souvent suivie d'une autre ; « tu lances souvent X vers 9 h,
# je m'en occupe automatiquement ? ». Une suggestion refusée n'est plus reproposée.
# ----------------------------------------------------------------------------
[habits]
enabled = true
suggest_follow_ups = true
suggest_routines = true
window_days = 14           # période analysée
min_occurrences = 3        # occurrences (jours distincts) avant de suggérer
cooldown_hours = 24        # délai minimal entre deux suggestions du même type

[automations]
enabled = true             # « chaque matin à 9 h, lance mon workspace de dev », « rappelle-moi de … à 15 h »
check_interval_s = 30
announce = true            # « Comme prévu : … » à l'exécution

# Phrases personnalisées : remplace n'importe quelle réplique d'Iris (clé = texte ou liste de variantes).
# Clés : ack, greet, thanks_reply, done, not_understood, cancelled, follow_up, remembered, app_opened…
[phrases]
# ack = ["Oui chef ?", "Je t'écoute."]
# greet = "Salut toi ! On fait quoi ?"

# ----------------------------------------------------------------------------
# Agents IA lancés à la voix, en arrière-plan : « demande à Claude de corriger les tests dans le projet X »
# Chaque CLI utilise sa propre connexion (claude login, compte OpenCode…) : aucune clé API dans Iris.
# ----------------------------------------------------------------------------
[agents]
enabled = false
default = "claude"         # "claude" (Claude Code) | "opencode" | "codex" | "gemini"
timeout_s = 600
workdir = ""               # dossier par défaut ; « … dans le projet X » prend le dessus
# [agents.bins]
# claude = "/home/moi/.local/bin/claude"

[projects]
# Nom prononcé = dossier. Sans entrée ici, Iris cherche dans system.project_dirs (~/projets, ~/code, ~/dev…).
# "cnvs clone" = "~/projets/cnvs-clone"

[apps]
# Alias supplémentaires : nom prononcé = commande (ou "webapp:URL").
# Exemples :
# "mon éditeur" = "zed"
# "mes mails" = "webapp:https://mail.proton.me"

[bluetooth]
# Alias pour « connecte mes écouteurs » : nom prononcé = nom (ou adresse MAC) tel que listé par bluetoothctl.
# "mes écouteurs" = "WH-1000XM5"

# ----------------------------------------------------------------------------
# Sessions de workspaces : « ouvre ma session vidéo » lance chaque application sur son workspace.
# « sauvegarde la session vidéo » enregistre les fenêtres ouvertes sous ce nom (dans le journal).
# ----------------------------------------------------------------------------
# [[sessions]]
# name = "video"
# phrases = ["ma session vidéo", "session montage"]
# apps = [
#   { workspace = 3, exec = "kdenlive" },
#   { workspace = 4, exec = "$TERMINAL -e btop" },
# ]

# ----------------------------------------------------------------------------
# Tâches longues surveillées : « lance la compilation » puis Iris annonce la fin (succès / échec, durée).
# « surveille la compilation » lance la tâche si elle existe ici, sinon surveille un processus du même nom.
# ----------------------------------------------------------------------------
# [[tasks]]
# name = "compilation"
# phrases = ["lance la compilation", "compile le projet"]
# exec = "cargo build --release"
# cwd = "~/projets/cnvs-clone"
# announce = true          # annonce vocale à la fin
# notify = true            # notification bureau

# ----------------------------------------------------------------------------
# Commandes personnalisées : une phrase (ou plusieurs) → un script shell.
# ----------------------------------------------------------------------------
# [[commands]]
# name = "workspace-dev"
# phrases = ["lance mon workspace de dev", "ouvre mon environnement de dev"]
# exec = "hyprctl dispatch workspace 2 && ghostty -e nvim ~/projets"
# confirm = false          # demander confirmation avant d'exécuter
# wait = false             # attendre la fin de la commande avant de répondre
# reply = "Workspace de dev lancé."
